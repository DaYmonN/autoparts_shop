server {
    listen 8000;
    server_name localhost 127.0.0.1;
    
    client_max_body_size 10M;

    access_log /var/log/nginx/autoparts_access.log;
    error_log /var/log/nginx/autoparts_error.log;

    location /static/ {
        alias /home/dmitry/autoparts_project/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /home/dmitry/autoparts_project/media/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        include uwsgi_params;
        uwsgi_pass unix:///home/dmitry/autoparts_project/autoparts.sock;
        
        uwsgi_connect_timeout 75;
        uwsgi_read_timeout 300;
        
        uwsgi_param Host $host;
        uwsgi_param X-Real-IP $remote_addr;
        uwsgi_param X-Forwarded-For $proxy_add_x_forwarded_for;
        uwsgi_param X-Forwarded-Proto $scheme;
    }

    error_page 500 502 503 504 /500.html;
    location = /500.html {
        root /home/dmitry/autoparts_project/templates/errors/;
    }
}
