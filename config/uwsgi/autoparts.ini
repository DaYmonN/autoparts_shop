[uwsgi]
chdir = /home/dmitry/autoparts_project
home = /home/dmitry/autoparts_project/venv
module = autoparts_shop.wsgi:application

master = true
processes = 4
threads = 2
enable-threads = true

socket = /home/dmitry/autoparts_project/autoparts.sock
chmod-socket = 666
chown-socket = dmitry:dmitry

harakiri = 60
harakiri-verbose = true

daemonize = /tmp/uwsgi.log
log-date = true
log-format = %(asctime) [%(pid)] %(proto) %(method) %(uri) => generated %(size) bytes in %(msecs) ms

vacuum = true

env = DJANGO_SETTINGS_MODULE=autoparts_shop.settings

max-requests = 5000
max-worker-lifetime = 3600
reload-on-rss = 256

uid = dmitry
gid = dmitry
single-interpreter = true
die-on-term = true
need-app = true
